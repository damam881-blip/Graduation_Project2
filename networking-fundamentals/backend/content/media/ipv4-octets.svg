<svg xmlns="http://www.w3.org/2000/svg" width="640" height="280" viewBox="0 0 640 280" role="img" aria-label="An IPv4 address split into four octets">
  <rect width="640" height="280" fill="#f7f9fc"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="60" y="90" width="110" height="70" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="115" y="135" font-size="26" fill="#312e81">192</text>
    <rect x="190" y="90" width="110" height="70" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="245" y="135" font-size="26" fill="#312e81">168</text>
    <rect x="320" y="90" width="110" height="70" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="375" y="135" font-size="26" fill="#312e81">1</text>
    <rect x="450" y="90" width="110" height="70" rx="8" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
    <text x="505" y="135" font-size="26" fill="#312e81">50</text>
    <text x="115" y="195" font-size="14" fill="#475569">octet 1</text>
    <text x="245" y="195" font-size="14" fill="#475569">octet 2</text>
    <text x="375" y="195" font-size="14" fill="#475569">octet 3</text>
    <text x="505" y="195" font-size="14" fill="#475569">octet 4</text>
    <text x="320" y="240" font-size="16" fill="#334155">4 octets x 8 bits = 32 bits</text>
  </g>
  <text x="170" y="135" font-family="Arial, sans-serif" font-size="26" fill="#312e81">.</text>
  <text x="300" y="135" font-family="Arial, sans-serif" font-size="26" fill="#312e81">.</text>
  <text x="430" y="135" font-family="Arial, sans-serif" font-size="26" fill="#312e81">.</text>
</svg>
