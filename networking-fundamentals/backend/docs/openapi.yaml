openapi: 3.0.3
info:
  title: Networking Fundamentals Backend API
  version: 1.0.0
  description: |
    Contract for the trusted TypeScript backend (Firebase Functions) of the
    Networking Fundamentals learning MVP.

    Every response uses one of two envelopes:

    * success: {"success": true, "data": <payload>}
    * failure: {"success": false, "error": {"code": <code>, "message": <message>}}

    Versioning decision (N1-11): the MVP contract is version 1 and the
    envelope deliberately contains no `schemaVersion` field. Adding one, or
    adding correlation IDs to public bodies, is a breaking contract change
    that must be agreed and regression-tested before adoption.

    All endpoints send `Cache-Control: no-store`. `GET /health`,
    `GET /me`, `GET /studentAccess` and `GET /adminAccess` are GET-only;
    `POST /profile` and `POST /deleteAccount` are POST-only and reject any
    other method with `405 METHOD_NOT_SUPPORTED` plus `Allow: POST`.
servers:
  - url: http://127.0.0.1:5001/demo-networking-p1/us-central1
    description: Local Firebase Functions emulator (host machine)
  - url: http://LAPTOP_LAN_IP:5001/demo-networking-p1/us-central1
    description: Same emulator reached from the Android device over the LAN (N7)
tags:
  - name: System
    description: Public operational endpoints
  - name: Auth
    description: Firebase ID token identity
  - name: Profile
    description: Server-side profile provisioning and account lifecycle
  - name: Authorization
    description: Role-gated demonstration endpoints
paths:
  /health:
    get:
      tags: [System]
      summary: Public health check
      operationId: getHealth
      security: []
      responses:
        "200":
          description: Service is running
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              example:
                success: true
                data:
                  status: ok
                  service: networking-backend
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /me:
    get:
      tags: [Auth]
      summary: Returns the verified caller UID
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Verified identity
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
              example:
                success: true
                data:
                  uid: verified-uid-example
        "401":
          $ref: "#/components/responses/Unauthorized"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
  /studentAccess:
    get:
      tags: [Authorization]
      summary: Requires a verified current Student role
      operationId: getStudentAccess
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Caller is a current Student
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentAccessResponse"
              example:
                success: true
                data:
                  uid: verified-uid-example
                  role: student
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/AuthServiceUnavailable"
  /adminAccess:
    get:
      tags: [Authorization]
      summary: Requires a verified current Admin role
      operationId: getAdminAccess
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Caller is a current Admin
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminAccessResponse"
              example:
                success: true
                data:
                  uid: verified-uid-example
                  role: admin
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotAllowed"
        "503":
          $ref: "#/components/responses/AuthServiceUnavailable"
  /profile:
    post:
      tags: [Profile]
      summary: Creates or returns the caller's users/{uid} profile
      description: |
        Idempotent provisioning (api-contract.md section 5.5). The request
        has no body; identity, role and timestamps come from the verified
        token and the server clock. A UID that already has an
        `accountTombstones/{uid}` document is rejected with `403 FORBIDDEN`
        (V-20 tombstone guard), so a stale token cannot resurrect a
        deleted or purged account.
      operationId: postProfile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Profile exists after this call
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileResponse"
              example:
                success: true
                data:
                  uid: verified-uid-example
                  displayName: Verified User
                  preferredLanguage: en
                  role: student
                  status: active
                  created: true
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotSupported"
        "503":
          $ref: "#/components/responses/ProfileUnavailable"
  /deleteAccount:
    post:
      tags: [Profile]
      summary: Deletes the caller's account in the documented purge order
      description: |
        Executes the `data-model.md` section 7 sequence in one request
        (api-contract.md section 5.6): tombstone + profile status in a
        single transaction, Auth deletion, recursive purge of the five
        private subcollections, profile removal, then the tombstone
        advances to `purged` and is never deleted. The client must
        re-authenticate with the password immediately before calling.
        A retry after a partial failure resumes; a tombstone already in
        `purged` state fails closed with `403`.
      operationId: postDeleteAccount
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The full purge ran during this request
          headers:
            Cache-Control:
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteAccountResponse"
              example:
                success: true
                data:
                  uid: verified-uid-example
                  status: purged
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "405":
          $ref: "#/components/responses/MethodNotSupported"
        "503":
          $ref: "#/components/responses/DeletionUnavailable"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Firebase ID token
      description: |
        Verified Firebase ID token. The client must send exactly
        `Authorization: Bearer <idToken>` and must never send a UID or role
        in the query string or in custom headers.
  schemas:
    ApiErrorCode:
      type: string
      description: Stable public error identifier.
      enum:
        - UNAUTHENTICATED
        - INVALID_TOKEN
        - FORBIDDEN
        - METHOD_NOT_ALLOWED
        - METHOD_NOT_SUPPORTED
        - AUTH_SERVICE_UNAVAILABLE
        - PROFILE_UNAVAILABLE
        - DELETION_UNAVAILABLE
    ApiFailure:
      type: object
      required: [success, error]
      additionalProperties: false
      properties:
        success:
          type: boolean
          enum: [false]
        error:
          type: object
          required: [code, message]
          additionalProperties: false
          properties:
            code:
              $ref: "#/components/schemas/ApiErrorCode"
            message:
              type: string
    HealthResponse:
      type: object
      required: [success, data]
      additionalProperties: false
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [status, service]
          additionalProperties: false
          properties:
            status:
              type: string
              enum: [ok]
            service:
              type: string
              enum: [networking-backend]
    MeResponse:
      type: object
      required: [success, data]
      additionalProperties: false
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [uid]
          additionalProperties: false
          properties:
            uid:
              type: string
              description: UID from the verified token, never from the request.
    StudentAccessResponse:
      type: object
      required: [success, data]
      additionalProperties: false
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [uid, role]
          additionalProperties: false
          properties:
            uid:
              type: string
            role:
              type: string
              enum: [student]
    AdminAccessResponse:
      type: object
      required: [success, data]
      additionalProperties: false
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [uid, role]
          additionalProperties: false
          properties:
            uid:
              type: string
            role:
              type: string
              enum: [admin]
    ProfileResponse:
      type: object
      required: [success, data]
      additionalProperties: false
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [uid, preferredLanguage, role, status, created]
          additionalProperties: false
          properties:
            uid:
              type: string
              description: UID from the verified token, never from the request.
            displayName:
              type: string
              nullable: true
              description: Trimmed `name` claim capped at 80 characters.
            preferredLanguage:
              type: string
              enum: [en, ar]
            role:
              type: string
              enum: [student]
            status:
              type: string
              enum: [active]
            created:
              type: boolean
              description: True only when this call created the document.
    DeleteAccountResponse:
      type: object
      required: [success, data]
      additionalProperties: false
      properties:
        success:
          type: boolean
          enum: [true]
        data:
          type: object
          required: [uid, status]
          additionalProperties: false
          properties:
            uid:
              type: string
              description: UID from the verified token, never from the request.
            status:
              type: string
              enum: [purged]
              description: Terminal tombstone state reached by this request.
  responses:
    Unauthorized:
      description: |
        Missing, malformed, invalid, expired, or revoked credentials.
        `UNAUTHENTICATED` means no usable Bearer token was supplied;
        `INVALID_TOKEN` means the token was supplied but rejected.
      headers:
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiFailure"
          examples:
            missingToken:
              value:
                success: false
                error:
                  code: UNAUTHENTICATED
                  message: A valid Bearer token is required.
            invalidToken:
              value:
                success: false
                error:
                  code: INVALID_TOKEN
                  message: The authentication token is invalid.
    Forbidden:
      description: |
        The caller is authenticated but is not a current holder of the
        required role, the live role differs from the token role, the account
        is disabled, the account no longer exists, or a deletion tombstone
        exists for the UID (V-20 guard).
      headers:
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiFailure"
          example:
            success: false
            error:
              code: FORBIDDEN
              message: You do not have permission to access this resource.
    MethodNotAllowed:
      description: The endpoint only accepts GET.
      headers:
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
        Allow:
          schema:
            type: string
            enum: [GET]
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiFailure"
          example:
            success: false
            error:
              code: METHOD_NOT_ALLOWED
              message: Only GET requests are supported.
    AuthServiceUnavailable:
      description: |
        The authorization service could not be queried. This is an
        availability failure, not a permission decision.
      headers:
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiFailure"
          example:
            success: false
            error:
              code: AUTH_SERVICE_UNAVAILABLE
              message: Authorization service is temporarily unavailable.
    MethodNotSupported:
      description: The endpoint only accepts POST.
      headers:
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
        Allow:
          schema:
            type: string
            enum: [POST]
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiFailure"
          example:
            success: false
            error:
              code: METHOD_NOT_SUPPORTED
              message: This HTTP method is not supported for this endpoint.
    ProfileUnavailable:
      description: |
        Firestore rejected or failed the profile read/create. This is an
        availability failure, not a permission decision, and the client
        may retry.
      headers:
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiFailure"
          example:
            success: false
            error:
              code: PROFILE_UNAVAILABLE
              message: The profile service is temporarily unavailable.
    DeletionUnavailable:
      description: |
        An unexpected failure occurred while writing the tombstone,
        deleting the Auth user, or purging user data. The deletion is
        resumable: a retry continues the sequence from the tombstone.
      headers:
        Cache-Control:
          schema:
            type: string
            enum: [no-store]
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiFailure"
          example:
            success: false
            error:
              code: DELETION_UNAVAILABLE
              message: The account deletion service is temporarily unavailable.
